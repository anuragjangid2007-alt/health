{% extends "base.html" %}
{% block title %}Login | HealthCheck AI{% endblock %}

{% block content %}

<section class="auth-wrapper">
    <div class="auth-card">
        <span class="badge">Welcome Back</span>
        <h1>Login to your account</h1>
        <p class="muted">Access your saved questions and profile.</p>

    <form method="POST" class="form-stack">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="btn primary full-width" type="submit">Login</button>
    </form>

    <p class="auth-switch">Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>
</div>

</section>
{% endblock %}
