{% extends "base.html" %}
{% block title %}Create Account | HealthCheck AI{% endblock %}

{% block content %}

<section class="auth-wrapper">
    <div class="auth-card">
        <span class="badge">Join HealthCheck AI</span>
        <h1>Create your account</h1>
        <p class="muted">Your account will have its own profile and search history.</p>

    <form method="POST" class="form-stack">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" maxlength="80"
               autocomplete="name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="254"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="8" autocomplete="new-password" required>
        <p class="small">Use at least 8 characters.</p>

        <button class="btn primary full-width" type="submit">Create Account</button>
    </form>

    <p class="auth-switch">Already registered?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>

</section>
{% endblock %}
